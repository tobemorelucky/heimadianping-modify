name: hmdp-aiops-demo

# Isolated, recoverable dependencies for the local MySQL persistence demo.
# Application JVMs remain host processes. The Consumer-only MySQL proxy is a
# manually controlled demo fault boundary; starting the stack keeps it healthy.
services:
  mysql-demo:
    image: mysql:8.0.30
    container_name: hmdp-aiops-demo-mysql
    hostname: mysql-demo
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=101
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${AIOPS_DEMO_MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: hmdp
    ports:
      - "127.0.0.1:${AIOPS_DEMO_MYSQL_PORT:-13307}:3306"
    volumes:
      - hmdp-aiops-demo-mysql-data:/var/lib/mysql
      - ./src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/01-hmdp.sql:ro
    networks:
      - hmdp-aiops-demo-network
    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent && [ \"$$(mysql -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} -Nse \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='hmdp' AND table_name IN ('tb_blog','tb_blog_comments','tb_follow','tb_seckill_voucher','tb_shop','tb_shop_type','tb_user','tb_user_info','tb_voucher','tb_voucher_order')\")\" -eq 10 ]"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql-consumer-proxy:
    # Reuse the already required Alpine image only for its BusyBox TCP relay.
    # The proxy has no volume and cannot modify MySQL configuration or data.
    image: redis:7-alpine
    container_name: hmdp-aiops-demo-mysql-consumer-proxy
    hostname: mysql-consumer-proxy
    restart: unless-stopped
    stop_grace_period: 5s
    command:
      - sh
      - -c
      - exec nc -lk -p 3306 -e nc mysql-demo 3306
    ports:
      - "127.0.0.1:${AIOPS_DEMO_CONSUMER_MYSQL_PROXY_PORT:-13308}:3306"
    depends_on:
      mysql-demo:
        condition: service_healthy
    networks:
      - hmdp-aiops-demo-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 1 127.0.0.1 3306"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  redis-demo:
    image: redis:7-alpine
    container_name: hmdp-aiops-demo-redis
    hostname: redis-demo
    restart: unless-stopped
    stop_grace_period: 10s
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${AIOPS_DEMO_REDIS_PORT:-16379}:6379"
    volumes:
      - hmdp-aiops-demo-redis-data:/data
    networks:
      - hmdp-aiops-demo-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka-demo:
    image: apache/kafka:3.9.2
    container_name: hmdp-aiops-demo-kafka
    hostname: kafka-demo
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${AIOPS_DEMO_KAFKA_PORT:-29092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-demo:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://127.0.0.1:${AIOPS_DEMO_KAFKA_PORT:-29092},PLAINTEXT://kafka-demo:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzRvyQ"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - hmdp-aiops-demo-kafka-data:/var/lib/kafka/data
      # The upstream image declares these paths as volumes. Name them explicitly
      # so every persistent mount remains attributable to the Demo project.
      - hmdp-aiops-demo-kafka-secrets:/etc/kafka/secrets
      - hmdp-aiops-demo-kafka-config:/mnt/shared/config
    networks:
      - hmdp-aiops-demo-network
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --list >/dev/null 2>&1"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  hmdp-aiops-demo-network:
    name: hmdp-aiops-demo-network
    driver: bridge

volumes:
  hmdp-aiops-demo-mysql-data:
    name: hmdp-aiops-demo-mysql-data
  hmdp-aiops-demo-redis-data:
    name: hmdp-aiops-demo-redis-data
  hmdp-aiops-demo-kafka-data:
    name: hmdp-aiops-demo-kafka-data
  hmdp-aiops-demo-kafka-secrets:
    name: hmdp-aiops-demo-kafka-secrets
  hmdp-aiops-demo-kafka-config:
    name: hmdp-aiops-demo-kafka-config
